<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101014">
<title>MY MEDIA CENTER — Радио</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#1a1a21;--muted:#9b9ba8;--red:#e53945;--line:#2b2b35}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3a1820 0,transparent 55%),var(--bg);color:#f7f7fa;font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:520px;margin:auto;padding:28px 18px 36px}.brand{font-size:12px;letter-spacing:2.5px;color:#aaa;text-align:center}.title{text-align:center;font-size:30px;font-weight:800;margin:9px 0 5px}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
.player{background:linear-gradient(145deg,#22222b,#17171d);border:1px solid var(--line);border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 18px 50px #0006}
.disc{width:142px;height:142px;border-radius:50%;margin:4px auto 20px;background:repeating-radial-gradient(circle,#24242c 0 5px,#15151b 6px 10px);border:8px solid #292932;display:grid;place-items:center;position:relative}
.disc:before{content:"";width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#f15a64,#a70f20);box-shadow:0 0 25px #e5394555}
.disc:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#17171d}
.disc.playing{animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.now{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.station{font-size:22px;font-weight:750;margin:6px 0 18px;min-height:30px}
.controls{display:flex;justify-content:center;align-items:center;gap:16px}.play{border:0;background:var(--red);color:white;width:64px;height:64px;border-radius:50%;font-size:24px;font-weight:700;box-shadow:0 8px 24px #e5394544}
.status{color:var(--muted);font-size:12px;margin-top:17px;min-height:18px}
.volume{display:flex;align-items:center;gap:10px;margin-top:18px;padding:0 6px}.vol-icon{font-size:15px;flex:none}
.volume input[type=range]{flex:1;accent-color:var(--red);height:4px}
.list{margin-top:24px}.list h2{font-size:13px;letter-spacing:1.4px;color:var(--muted);font-weight:650;margin:0 0 12px 4px}
.station-btn{width:100%;border:1px solid var(--line);background:var(--panel);color:#f7f7fa;border-radius:16px;padding:16px;margin:7px 0;text-align:left;display:flex;align-items:center;gap:13px;font:inherit}
.station-btn.active{border-color:var(--red);background:#291b21}.dot{width:10px;height:10px;border-radius:50%;background:#555;flex:none}.active .dot{background:var(--red);box-shadow:0 0 12px #e53945}.name{font-weight:650}.desc{font-size:12px;color:var(--muted);margin-top:3px}
footer{text-align:center;color:#696975;font-size:11px;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="brand">MY MEDIA CENTER</div>
  <div class="title">РАДИО</div>
  <div class="subtitle">Любимые станции — в одном месте</div>
  <section class="player">
    <div class="disc" id="disc"></div>
    <div class="now">СЕЙЧАС В ЭФИРЕ</div>
    <div class="station" id="current">Выберите радиостанцию</div>
    <div class="controls"><button class="play" id="play" aria-label="Воспроизвести">▶</button></div>
    <div class="status" id="status">Нажмите на станцию — заиграет сразу</div>
    <div class="volume"><span class="vol-icon">🔊</span><input type="range" id="volume" min="0" max="100" value="80" aria-label="Громкость"></div>
    <audio id="audio" preload="none" playsinline></audio>
  </section>
  <section class="list">
    <h2>РАДИОСТАНЦИИ</h2>
    <button class="station-btn" data-name="Мелодія FM" data-url="https://online.melodiafm.ua/MelodiaFM"><span class="dot"></span><span><div class="name">Мелодія FM</div><div class="desc">Музыка хорошего настроения</div></span></button>
    <button class="station-btn" data-name="Хіт FM" data-url="https://online.hitfm.ua/HitFM_HD"><span class="dot"></span><span><div class="name">Хіт FM</div><div class="desc">Главные хиты</div></span></button>
    <button class="station-btn" data-name="Наше Радіо" data-url="https://online.nasheradio.ua/NasheRadio_HD"><span class="dot"></span><span><div class="name">Наше Радіо</div><div class="desc">Украинская музыка</div></span></button>
  </section>
  <footer>Нажми на станцию — воспроизведение начнётся сразу.</footer>
</main>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();
const audio=document.getElementById('audio'),play=document.getElementById('play'),disc=document.getElementById('disc'),current=document.getElementById('current'),status=document.getElementById('status'),volume=document.getElementById('volume');
let selected=null;
const buttons=[...document.querySelectorAll('.station-btn')];
function setPlaying(on){play.textContent=on?'Ⅱ':'▶';disc.classList.toggle('playing',on);status.textContent=on?'Воспроизведение':'Пауза';}
audio.volume=volume.value/100;
volume.addEventListener('input',()=>{audio.volume=volume.value/100;});
buttons.forEach(btn=>btn.addEventListener('click',()=>{
  const same=selected===btn;
  buttons.forEach(b=>b.classList.toggle('active',b===btn));
  selected=btn;current.textContent=btn.dataset.name;
  if(!same){
    audio.pause();audio.src=btn.dataset.url;
    status.textContent='Подключаемся к эфиру…';
    audio.play().then(()=>setPlaying(true)).catch(()=>status.textContent='Не удалось запустить поток. Нажмите ▶ ещё раз.');
  } else if(audio.paused){
    audio.play().then(()=>setPlaying(true)).catch(()=>status.textContent='Не удалось запустить поток. Попробуйте ещё раз.');
  } else {
    audio.pause();setPlaying(false);
  }
}));
play.addEventListener('click',()=>{
  if(!selected){status.textContent='Сначала выберите радиостанцию';return;}
  if(audio.paused){if(!audio.src)audio.src=selected.dataset.url;audio.play().then(()=>setPlaying(true)).catch(()=>status.textContent='Поток недоступен. Попробуйте другую станцию.');}
  else{audio.pause();setPlaying(false);}
});
audio.addEventListener('playing',()=>setPlaying(true));
audio.addEventListener('pause',()=>{if(audio.src)setPlaying(false)});
audio.addEventListener('waiting',()=>status.textContent='Подключаемся к эфиру…');
audio.addEventListener('error',()=>{setPlaying(false);status.textContent='Ошибка потока. Попробуйте другую станцию.'});
</script>
</body>
</html>
